services:
  postgres:
    image: postgres:17-alpine
    container_name: concorde-postgres
    environment:
      POSTGRES_DB: concorde
      POSTGRES_USER: concorde
      POSTGRES_PASSWORD: change-me-in-local-env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concorde -d concorde"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - concorde-postgres-data:/var/lib/postgresql/data

volumes:
  concorde-postgres-data:
