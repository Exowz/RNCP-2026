[project]
name = "concorde"
version = "0.1.0"
description = "Concorde — moteur d'anomalie, de cohérence et de confiance sur le croisement DVF+ x DPE ADEME x Georisques"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Candidat RNCP Developpeur en IA" }]

dependencies = [
    # --- Socle / configuration ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.9",
    # --- Collecte (C1) ---
    "httpx>=0.28",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tenacity>=9.0",
    # --- Donnees / stockage (C2, C3, C4) ---
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=25.0.1",
    "duckdb>=1.1",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    # --- Big data (C1, C2) ---
    "pyspark>=3.5,<4.0",
    # --- APIs (C5, C9) ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    # --- Sécurité des échanges et de l'artefact ---
    "cryptography>=50.0.0",
    # --- Modele (C9, C12, C13) ---
    "torch>=2.5",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    # --- MLOps / monitoring (C11, C13, C20) ---
    # Le suivi local n'utilise ni serveur de deploiement ni UI : l'edition
    # skinny garde l'API de tracking et evite le plafond cryptography de mlflow.
    "mlflow-skinny>=3.15.1",
    # `mlflow-skinny` n'embarque PAS les dependances du magasin SQL. Or le suivi
    # est configure sur `sqlite:///mlflow.db` (MLflow 3 a deprecie le magasin
    # fichier), et MLflow applique des migrations de schema a l'ouverture.
    # Sans alembic, `python -m concorde.model.entrainement` echoue au
    # journalisation. Cette ligne est donc la contrepartie explicite du passage
    # a l'edition skinny, pas une dependance decorative.
    "alembic>=1.13",
    "dvc>=3.58",
    "evidently>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "types-requests>=2.32",
]

[project.scripts]
concorde = "concorde.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concorde", "api", "app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "data: tests du bloc 1 (collecte, nettoyage, base)",
    "model: tests du modele (C12)",
    "api: tests des APIs (C5, C9)",
    "app: tests de l'application (C10, C17)",
    "slow: tests longs (Spark, entrainement complet)",
    "regression: tests de non-regression lies a un incident (C21)",
    "local_service: test necessitant un service local deja charge (LM Studio)",
]

[tool.coverage.run]
source = ["src/concorde", "api", "app"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "api", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "PTH"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"notebooks/*" = ["ALL"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "notebooks"]
